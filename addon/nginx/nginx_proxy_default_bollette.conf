# Bollette/ConsumiCasa — API del backend sotto lo stesso dominio HTTPS del proxy.
# Snippet per l'add-on "NGINX Home Assistant SSL proxy" in modalita' customize:
# va copiato in /share (pattern di default: nginx_proxy_default*.conf) e viene
# incluso nel blocco server{} del vhost HTTPS. Dopo la copia: riavviare l'add-on NGINX.
#
# Effetto: https://<dominio>/bollette-api/...  ->  http://192.168.1.15:8000/...
# (il prefisso viene rimosso: il backend vede /api/..., /database/pdfs/..., ecc.)
# Cosi' l'app servita via proxy (/local/Bollette/) chiama l'API SAME-ORIGIN:
# niente mixed content, funziona anche da fuori casa.
location /bollette-api/ {
    proxy_pass http://192.168.1.15:8000/;   # IP host, NON 127.0.0.1 (l'add-on NGINX non e' host-network)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64m;      # upload PDF bollette (anche scansioni pesanti)
    proxy_read_timeout 180s;       # estrazione Gemini ~20-30 s: margine largo

    # Decisione di Matteo (bacheca 11/07/2026): LETTURE da ovunque, SCRITTURE
    # solo dalla LAN. Il dominio DuckDNS non e' un segreto (Certificate
    # Transparency) e l'app non ha autenticazione propria: senza questo blocco
    # chiunque potrebbe scrivere i JSON o consumare la quota Gemini.
    limit_except GET HEAD {
        allow 192.168.1.0/24;
        deny all;
    }
}

# --- Frontend senza cache di 31 giorni (bacheca 26/07/2026, parere Jarvis; vai
# di Matteo 24/08/2026) ---------------------------------------------------------
# HA serve /local (= www/) con "Cache-Control: public, max-age=2678400": dopo
# ogni pubblicazione il browser mostra la versione VECCHIA per un mese. Via
# proxy, i file di /local/Bollette/static/ li serve invece il backend (8000),
# che ha il middleware no-cache: refresh normale = versione nuova, sempre.
# Stessi URL di sempre; copre SOLO questa cartella (Quadro Jarvis e F.A.M.ilia
# non sono toccati). Sotto la rotta risponde l'intera app del backend (es.
# .../static/api/...): API e PDF esigono comunque la chiave X-Bollette-Key, e
# il limit_except qui sotto (condizione di Jarvis) tiene le scritture in LAN
# come su /bollette-api/ — difesa in profondita' invariata.
# NB: l'accesso diretto 8123/local/... resta con la cache di HA (non e' cosa
# nostra): usare sempre DuckDNS, dentro e fuori casa.
location /local/Bollette/static/ {
    proxy_pass http://192.168.1.15:8000/;   # /local/Bollette/static/x -> :8000/x
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64m;
    proxy_read_timeout 180s;

    limit_except GET HEAD {
        allow 192.168.1.0/24;
        deny all;
    }
}
