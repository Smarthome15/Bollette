# Add-on locale Home Assistant: backend Python dell'app Bollette/ConsumiCasa.
# Vive in /addons/bollette_backend sul Raspberry (consegna: addon/deploy_addon.ps1).
# Il CODICE dell'app NON è dentro l'add-on: gira da /homeassistant/bollette_app
# (area PRIVATA, fuori da www/ — bonifica /local del 2026-07-19; la stessa
# cartella pubblicata con "Pubblica su NAS"), così pubblicare + riavviare
# l'add-on = deploy. Vincoli concordati con Jarvis (11/07/2026):
# boot auto + watchdog, chiave Gemini nelle options, log sobri.
name: "Bollette Backend (ConsumiCasa)"
version: "1.0.5"
slug: "bollette_backend"
description: "Backend Python dell'app Bollette/ConsumiCasa: API, salvataggio JSON, estrazione bollette PDF via Gemini."
url: "https://github.com/Smarthome15/Bollette"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
watchdog: "tcp://[HOST]:[PORT:8000]"
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "API + interfaccia web ConsumiCasa"
map:
  - type: homeassistant_config
    read_only: false
options:
  gemini_api_key: ""
  chiave_accesso: ""
schema:
  gemini_api_key: "password?"
  # Chiave di accesso alle API (bonifica accessi 2026-07-26). Opzionale QUI
  # perché il backend la legge anche da secrets_local.py (pubblicato nell'area
  # privata); se valorizzata nelle options ha la precedenza. Senza chiave da
  # nessuna delle due fonti il backend fallisce CHIUSO (503 su tutto tranne health).
  chiave_accesso: "password?"
